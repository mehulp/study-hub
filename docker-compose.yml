services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: study_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: study_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_hub -d study_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      # Inside the Compose network, services reach Postgres by service name
      # ("postgres"), not "localhost" — the .env used for manual/local runs
      # is never copied into the image (see .dockerignore), so every var
      # the app needs is set explicitly here instead.
      DATABASE_URL: postgresql+psycopg://study_hub:${POSTGRES_PASSWORD}@postgres:5432/study_hub
      JWT_PRIVATE_KEY_PATH: private_key.pem
      JWT_PUBLIC_KEY_PATH: public_key.pem
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/.well-known/jwks.json')"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  items:
    build: ./services/items
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://study_hub:${POSTGRES_PASSWORD}@postgres:5432/study_hub
      # Service-to-service call inside the Compose network uses the
      # service name "auth" — the same URL a human would use is
      # localhost:8001, but that only resolves on the host, not from
      # inside another container.
      AUTH_SERVICE_URL: http://auth:8001
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/docs')"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  board:
    build: ./services/board
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+psycopg://study_hub:${POSTGRES_PASSWORD}@postgres:5432/study_hub
      AUTH_SERVICE_URL: http://auth:8001
      ITEMS_SERVICE_URL: http://items:8002
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      items:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/docs')"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  connectors:
    build: ./services/connectors
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+psycopg://study_hub:${POSTGRES_PASSWORD}@postgres:5432/study_hub
      AUTH_SERVICE_URL: http://auth:8001
      ITEMS_SERVICE_URL: http://items:8002
      OAUTH_CLIENT_ID: connectors-service
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      # All three secrets below come from the root .env file (gitignored),
      # not hardcoded here — see Decision #66 (supersedes #57's original
      # "OAUTH_CLIENT_SECRET can stay hardcoded" reasoning, which assumed
      # a private, local-only repo).
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TWITTER_REDIRECT_URI: ${TWITTER_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      items:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/docs')"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth:8001
      ITEMS_SERVICE_URL: http://items:8002
      BOARD_SERVICE_URL: http://board:8003
      CONNECTORS_SERVICE_URL: http://connectors:8004
      # The web UI (web/, served by Vite on 5173) is a different origin
      # than Gateway — unlike the browser extension, which bypasses CORS
      # entirely via host_permissions, a plain webpage needs Gateway to
      # explicitly allow it.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      auth:
        condition: service_healthy
      items:
        condition: service_healthy
      board:
        condition: service_healthy
      connectors:
        condition: service_healthy

volumes:
  postgres_data:
