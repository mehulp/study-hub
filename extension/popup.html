<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bookmarks Hub</title>
  <style>
    body { font-family: sans-serif; width: 260px; padding: 12px; }
    button { width: 100%; padding: 8px; margin-top: 8px; }
    #status { margin-top: 10px; font-size: 13px; }
    .error { color: #b00020; }
    .success { color: #1a7f37; }
    a { font-size: 13px; }
  </style>
</head>
<body>
  <div id="not-connected" hidden>
    <p>This browser isn't connected yet.</p>
    <a href="#" id="open-options">Set up connection</a>
  </div>

  <div id="connected" hidden>
    <p>Connected.</p>
    <button id="sync-button">Sync Now</button>
  </div>

  <p id="status"></p>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
